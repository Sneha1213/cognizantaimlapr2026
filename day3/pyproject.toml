#configure toml 
[project]
name="healthcare"
version="1.0.0"
description="healthcare management"
requires-python = ">=3.8"

authors = [
    { name = "Sneha", email = "snehasatarke44@gmail.com" }
]

# Production dependencies
dependencies = [
    "faker>=13.3.3"
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=3.0.0",
    "black>=23.0.0",
    "isort>=5.10.1",
    "sphinx>=5.0.0"
]

[tool.black]
line-length = 88
target-version = ["py313"]